[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seat-hold-api"
version = "0.1.0"
description = "A small FastAPI service for exclusive, expiring seat holds"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.116.1",
  "uvicorn==0.35.0",
]

[dependency-groups]
dev = [
  "build==1.3.0",
  "httpx==0.28.1",
  "pytest==8.4.1",
  "ruff==0.12.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
