[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "seat-hold-api"
version = "0.1.0"
description = "Transactional HTTP API for temporary seat holds"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.116.1",
  "uvicorn==0.35.0",
]

[project.optional-dependencies]
test = [
  "httpx==0.28.1",
  "pytest==8.4.1",
]

[tool.setuptools.packages.find]
include = ["seat_hold_api*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

