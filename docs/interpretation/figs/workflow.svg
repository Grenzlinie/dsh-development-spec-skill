  <g fill="#f06f5f"><path d="M438 286l24 14-24 14z"/><path d="M808 286l24 14-24 14z"/><path d="M1178 286l24 14-24 14z"/><path d="M1311 523l14 24 14-24z"/><path d="M1102 586l-24 14 24 14z"/><path d="M732 586l-24 14 24 14z"/><path d="M362 586l-24 14 24 14z"/><path d="M201 377l14-24 14 24z"/></g>
  <text x="800" y="820" font-family="Arial, PingFang SC, sans-serif" font-size="26" fill="#10284a" text-anchor="middle">产品含义变化时回到 APPROVE，可逆的工程选择由 Agent 继续处理</text>
