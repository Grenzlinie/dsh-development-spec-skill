name: DeepSeek Harness plugin

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify generated Harness Skill
        run: python3 scripts/sync_dsh_plugin.py --check
      - name: Test Cordis provider
        run: npm test
      - name: Verify package boundary
        run: python3 scripts/verify_dsh_package.py
      - name: Verify repository governance
        run: python3 .codex/skills/spec-driven-development/scripts/specctl.py verify --root . --require-note
